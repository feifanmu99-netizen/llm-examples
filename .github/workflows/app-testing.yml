name: MarketPilot AI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<9'
      - name: Validate Python files
        run: python -m compileall -q app.py marketpilot
      - name: Run MarketPilot tests
        run: python -m pytest tests -q
